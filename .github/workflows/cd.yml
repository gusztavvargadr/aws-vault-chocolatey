name: Continuous Delivery

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  commit:
    name: Commit
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Init .NET
        run: dotnet tool restore

      - name: Package Cake
        run: dotnet cake --target package

      - name: Upload Chocolatey Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: chocolatey
          path: artifacts/chocolatey/

      - name: Read version from package.json
        if: github.ref == 'refs/heads/main'
        id: read-version
        shell: pwsh
        run: |
          $packageJson = Get-Content ./build/chocolatey/package.json | ConvertFrom-Json
          $version = $packageJson.Version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Version: $version"

      - name: Check for published release
        if: github.ref == 'refs/heads/main'
        id: check-release
        uses: actions/github-script@v8
        env:
          PACKAGE_VERSION: ${{ steps.read-version.outputs.version }}
        with:
          script: |
            const tag = `v${process.env.PACKAGE_VERSION}`;
            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
              const published = !release.draft;
              core.setOutput('published', String(published));
              core.info(published ? `${tag} is already published` : `${tag} is a draft`);
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('published', 'false');
              core.info(`${tag} has no release`);
            }

      - name: Generate release notes for draft
        if: github.ref == 'refs/heads/main' && steps.check-release.outputs.published == 'false'
        run: dotnet cake --target GenerateDraftReleaseNotes --release-version ${{ steps.read-version.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create or update draft release
        if: github.ref == 'refs/heads/main' && steps.check-release.outputs.published == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.read-version.outputs.version }}
          name: v${{ steps.read-version.outputs.version }}
          body_path: artifacts/release-notes.md
          draft: true
          prerelease: false
          # Note: The git tag does not exist at this point. It will be created when the draft release is published.
          # The target_commitish specifies which commit the tag should point to when it's created during publishing.
          target_commitish: ${{ github.sha }}
          # If a draft release already exists for this tag, it will be updated.
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Clean Cake
        run: dotnet cake --target clean
        if: always()
